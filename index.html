<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilet Takip">
<meta name="theme-color" content="#123540">
<title>Bilet Takip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#E9EEF0; --paper:#FFFFFF; --ink:#123540; --muted:#5E737B; --line:#C9D4D8;
  --accent:#F2B705; --accent-ink:#2A2000;
  --ok:#2E8B57; --ok-soft:#DCF1E4; --ok-ink:#0F3D24;
  --danger:#C0392B; --danger-soft:#FBE1DD; --danger-ink:#5A120A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1D22; --paper:#17292F; --ink:#E6EEF0; --muted:#8FA5AC; --line:#2B434A;
    --ok:#4CB97C; --ok-soft:#173A28; --ok-ink:#D4F5E2;
    --danger:#E5604B; --danger-soft:#43201B; --danger-ink:#FFDCD5;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1D22; --paper:#17292F; --ink:#E6EEF0; --muted:#8FA5AC; --line:#2B434A;
  --ok:#4CB97C; --ok-soft:#173A28; --ok-ink:#D4F5E2;
  --danger:#E5604B; --danger-soft:#43201B; --danger-ink:#FFDCD5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px; line-height:1.45; -webkit-tap-highlight-color:transparent;
}
.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
.gizli{display:none!important}

/* Üst bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#123540;color:#E9EEF0;padding:12px 16px 10px}
.bas-ust{display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.55rem;line-height:1}
.rol{display:flex;align-items:center;gap:8px;font-size:.9rem}
.rol b{background:#F2B705;color:#2A2000;padding:2px 8px;border-radius:6px;font-weight:600}
.rol button{background:transparent;color:#E9EEF0;border:1px solid rgba(233,238,240,.4);padding:4px 10px;font-size:.85rem}
header .alt{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:.88rem;opacity:.85}
.durum{display:inline-flex;align-items:center;gap:6px}
.durum i{width:8px;height:8px;border-radius:50%;background:#4CB97C;display:inline-block}
.durum.yok i{background:#E5604B}

main{max-width:640px;margin:0 auto;padding:14px 12px 110px}

/* Sayaç kutuları */
.sayaclar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sayac{background:var(--paper);border-radius:10px;padding:10px 10px 8px;border-top:4px solid var(--line)}
.sayac.yesil{border-top-color:var(--ok)}
.sayac.sari{border-top-color:var(--accent)}
.sayac .et{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sayac .deger{font-size:2rem;line-height:1.05}
.sayac .kisi{font-size:.9rem;color:var(--muted)}
.sayac .kisi b{color:var(--ink)}

/* Bilet kartı */
.liste{display:flex;flex-direction:column;gap:10px}
.bilet{
  display:grid;grid-template-columns:78px 1fr;background:var(--paper);border-radius:10px;
  border:2px solid transparent;position:relative;transition:transform .18s ease, box-shadow .18s ease, opacity .2s;
}
.bilet .koc{
  border-right:2px dashed var(--line);padding:10px 6px;border-radius:8px 0 0 8px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;
}
.bilet .koc::before,.bilet .koc::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.bilet .koc::before{top:-9px}.bilet .koc::after{bottom:-9px}
.bilet .saat{font-size:1.5rem;line-height:1}
.bilet .saat-et{font-size:.72rem;opacity:.75;margin-top:2px}
.bilet .govde{padding:10px 10px 10px 12px;min-width:0}
.bilet .ust{display:flex;align-items:flex-start;gap:8px}
.bilet .no{font-size:2rem;line-height:1;word-break:break-all;flex:1}
.bilet .no small{font-size:.9rem;color:var(--muted);font-family:"Barlow",system-ui,sans-serif;font-weight:500;margin-right:4px}
.cip{font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:5px;background:var(--bg);color:var(--muted);white-space:nowrap;margin-top:3px}
.bilet .detay{margin-top:5px;color:var(--muted);font-size:.96rem}
.bilet .detay b{color:var(--ink);font-weight:600}
.zaman{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.krono{font-size:1.6rem;line-height:1}
.bitis{font-size:.9rem;color:var(--muted);opacity:.8}
.islemler{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

.tutamac{
  width:44px;height:44px;margin:-6px -4px 0 0;flex:none;display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--muted);font-size:1.5rem;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none;
}
.tutamac:active{background:var(--bg)}

/* Durum renkleri */
.bilet.aktif{border-color:var(--ok)}
.bilet.aktif .koc{background:var(--ok-soft);color:var(--ok-ink)}
.bilet.aktif .cip{background:var(--ok);color:#fff}
.bilet.aktif .krono{color:var(--ok)}
.bilet.doldu{border-color:var(--danger)}
.bilet.doldu .koc{background:var(--danger-soft);color:var(--danger-ink)}
.bilet.doldu .cip{background:var(--danger);color:#fff}
.bilet.doldu .krono{color:var(--danger)}
.bilet.pasif{opacity:.6}
.bilet.pasif .no{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--muted)}

/* Sürükleme */
.bilet.kalkik{z-index:10;box-shadow:0 14px 30px rgba(0,0,0,.28);transition:box-shadow .18s ease;opacity:1}
.surukleme-acik .bilet:not(.kalkik){transition:transform .18s ease}
.surukleme-acik{user-select:none;-webkit-user-select:none}

.yeni{animation:gel .9s ease-out}
@keyframes gel{from{box-shadow:0 0 0 4px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.yeni{animation:none}.bilet{transition:none}}

.bos{text-align:center;color:var(--muted);padding:36px 16px;border:2px dashed var(--line);border-radius:10px}

/* Butonlar ve form */
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--ink);color:var(--bg);padding:14px 18px;font-weight:600;font-size:1.05rem;width:100%}
.btn.sari{background:var(--accent);color:var(--accent-ink)}
.btn.ince{background:transparent;color:var(--ink);border:1.5px solid var(--line);width:auto;padding:10px 14px;font-size:.95rem}
.kucuk{background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:7px 11px;font-size:.88rem;font-weight:600}
.kucuk.baslat{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kucuk.pasifle{border-color:var(--ink)}
.kucuk.aktifle{border-color:var(--ok);color:var(--ok)}
.kucuk.sil{color:var(--danger);border-color:var(--danger)}

.kart{background:var(--paper);border-radius:12px;padding:16px;margin-bottom:16px}
.kart h2{margin:0 0 12px;font-size:1.15rem}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px;font-weight:500}
input{width:100%;font:inherit;font-size:1.25rem;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.alanlar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.alanlar .tam{grid-column:1/-1}
.hata{color:var(--danger);font-size:.92rem;min-height:1.2em;margin:6px 0 0}
.ust-satir{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px;gap:10px}
.ust-satir h2{margin:0;font-size:1.2rem}
.ipucu{font-size:.88rem;color:var(--muted);margin:-4px 4px 12px}

.gun{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--paper);color:var(--ink);padding:14px 16px;border-radius:10px}
.gun span{color:var(--muted);font-size:.95rem}

/* Alt menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--muted);padding:11px 2px 13px;border-radius:0;font-weight:600;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ik{font-size:1.2rem;line-height:1}
nav button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
nav button.kilitli{opacity:.5}

/* Giriş ekranı */
.giris{position:fixed;inset:0;z-index:20;background:#123540;display:flex;align-items:center;justify-content:center;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.giris-kart{background:var(--paper);border-radius:16px;padding:24px 20px;width:min(100%,380px)}
.giris-kart h1{margin:0 0 4px;font-size:2rem;line-height:1}
.giris-kart p.aciklama{margin:0 0 18px;color:var(--muted)}
.secim{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.secim button{padding:14px;font-weight:600;font-size:1.05rem;background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.secim button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.giris-kart .btn{margin-top:4px}
.giris-kart .btn.ince{width:100%;margin-top:10px}

dialog{border:0;border-radius:14px;padding:0;background:var(--paper);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:20px}
.dugmeler{display:flex;gap:10px;margin-top:6px}
.dugmeler .btn{flex:1}
</style>
</head>
<body>

<!-- GİRİŞ -->
<section id="giris" class="giris">
  <div class="giris-kart">
    <h1 class="num">Bilet Takip</h1>
    <p class="aciklama" id="girisAciklama">Giriş türünü seçip şifrenizi girin.</p>
    <div class="secim" role="group" aria-label="Giriş türü">
      <button type="button" data-rol="pist" aria-pressed="true">Pist</button>
      <button type="button" data-rol="admin" aria-pressed="false">Admin</button>
    </div>
    <label for="sifre">Şifre</label>
    <input id="sifre" type="password" inputmode="numeric" autocomplete="off">
    <p class="hata" id="sifreHata"></p>
    <button class="btn sari" id="girisBtn">Giriş yap</button>
    <button class="btn ince gizli" id="girisIptal">Vazgeç</button>
  </div>
</section>

<header>
  <div class="bas-ust">
    <h1 class="num">Bilet Takip</h1>
    <div class="rol"><b id="rolYazi"></b><button id="cikisBtn">Çıkış</button></div>
  </div>
  <div class="alt">
    <span id="bugunYazi"></span>
    <span id="durum" class="durum"><i></i><span>Bağlanıyor</span></span>
  </div>
</header>

<main>
  <!-- BUGÜN -->
  <section id="sayfa-bugun">
    <div class="sayaclar" data-sayac></div>
    <div class="liste" id="listeBugun"></div>
  </section>

  <!-- GEÇMİŞ -->
  <section id="sayfa-gecmis" class="gizli">
    <div id="gunListesiKutu">
      <div class="ust-satir"><h2>Geçmiş günler</h2></div>
      <div class="liste" id="gunListesi"></div>
    </div>
    <div id="gunDetayKutu" class="gizli">
      <div class="ust-satir">
        <button class="btn ince" id="geriBtn">‹ Günler</button>
        <h2 id="gunBaslik"></h2>
      </div>
      <div class="sayaclar" id="sayacGun"></div>
      <div class="liste" id="listeGun"></div>
    </div>
  </section>

  <!-- PİST -->
  <section id="sayfa-pist" class="gizli">
    <div class="sayaclar" data-sayac></div>
    <p class="ipucu">Sırayı değiştirmek için biletin sağ üstündeki ⠿ tutamağına basılı tutup sürükleyin.</p>
    <div class="liste" id="listePist"></div>
  </section>

  <!-- ADMIN -->
  <section id="sayfa-admin" class="gizli">
    <div class="kart">
      <h2>Yeni bilet</h2>
      <div class="alanlar">
        <div class="tam">
          <label for="fBilet">Bilet numarası</label>
          <input id="fBilet" inputmode="numeric" autocomplete="off" placeholder="örn. 3515 veya 01">
        </div>
        <div>
          <label for="fKisi">Kişi sayısı</label>
          <input id="fKisi" inputmode="numeric" autocomplete="off" placeholder="örn. 2">
        </div>
        <div>
          <label for="fSure">Süre (dakika)</label>
          <input id="fSure" inputmode="numeric" autocomplete="off" placeholder="örn. 20">
        </div>
      </div>
      <button class="btn sari" id="kaydetBtn">Bileti kaydet</button>
      <p class="hata" id="formHata"></p>
    </div>
    <div class="sayaclar" data-sayac></div>
    <div class="liste" id="listeAdmin"></div>
  </section>
</main>

<nav>
  <button data-sayfa="bugun"><span class="ik">🎟️</span>Bugün</button>
  <button data-sayfa="gecmis"><span class="ik">📅</span>Geçmiş</button>
  <button data-sayfa="pist"><span class="ik">🏁</span>Pist</button>
  <button data-sayfa="admin"><span class="ik">🔑</span>Admin</button>
</nav>

<!-- Düzenleme penceresi -->
<dialog id="duzenle">
  <form method="dialog">
    <h2 style="margin:0 0 14px;font-size:1.2rem">Bileti düzenle</h2>
    <div class="alanlar">
      <div class="tam">
        <label for="dBilet">Bilet numarası</label>
        <input id="dBilet" inputmode="numeric" autocomplete="off">
      </div>
      <div>
        <label for="dKisi">Kişi sayısı</label>
        <input id="dKisi" inputmode="numeric" autocomplete="off">
      </div>
      <div>
        <label for="dSure">Süre (dakika)</label>
        <input id="dSure" inputmode="numeric" autocomplete="off">
      </div>
      <div class="tam">
        <label for="dSaat">Satış saati</label>
        <input id="dSaat" type="time">
      </div>
    </div>
    <button type="button" class="btn ince gizli" id="dSifirla" style="width:100%;margin-bottom:12px">Süre başlangıcını sıfırla</button>
    <p class="hata" id="dHata"></p>
    <div class="dugmeler">
      <button type="button" class="btn ince" id="dIptal">Vazgeç</button>
      <button type="button" class="btn sari" id="dKaydet">Kaydet</button>
    </div>
  </form>
</dialog>

<script>
/* =========================================================
   AYARLAR
   Şifreler açık yazılmaz, özet (hash) olarak saklanır.
   Admin: 4169   Pist: 0000
   ========================================================= */
const SIFRE_OZET = { admin: "1cqs6431uj8", pist: "1qg2d0b5m92" };

const firebaseConfig = {
  apiKey: "AIzaSyAhFKv9979KOfyg7nLM0PE-jJDhyjzEtPw",
  authDomain: "gokart-e3cac.firebaseapp.com",
  projectId: "gokart-e3cac",
  storageBucket: "gokart-e3cac.firebasestorage.app",
  messagingSenderId: "478582130774",
  appId: "1:478582130774:web:48b18e183c4dd6e71d93f7"
};
/* ========================================================= */

const ozet = (str, seed = 7919) => {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iki = n => String(n).padStart(2, "0");
const gunAnahtari = (d = new Date()) => `${d.getFullYear()}-${iki(d.getMonth()+1)}-${iki(d.getDate())}`;
const saatYazi = (d = new Date()) => `${iki(d.getHours())}:${iki(d.getMinutes())}`;
const gunYazi = key => { const [y,m,d] = key.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); };
const zamanHesapla = (gun, saat) => { const [y,m,d] = gun.split("-").map(Number); const [h,mi] = saat.split(":").map(Number); return new Date(y,m-1,d,h,mi).getTime(); };
const sureYazi = ms => { const s = Math.max(0, Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sn = s%60; return h ? `${h}:${iki(m)}:${iki(sn)}` : `${iki(m)}:${iki(sn)}`; };
const aktifMi = b => b.aktif !== false;
const siraDegeri = b => (typeof b.sira === "number" ? b.sira : -(b.zaman || 0));
const sirala = l => [...l].sort((a, b) => siraDegeri(a) - siraDegeri(b));
const sonrakiNumara = s => { const m = String(s).match(/^(.*?)(\d+)$/); if (!m) return ""; return m[1] + String(parseInt(m[2],10) + 1).padStart(m[2].length, "0"); };

/* ---------- Veritabanı ---------- */
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const inc = firebase.firestore.FieldValue.increment;
const B = id => db.collection("biletler").doc(id);
const Veri = {
  async ekle(k) {
    const b = db.batch();
    b.set(db.collection("biletler").doc(), k);
    b.set(db.collection("gunler").doc(k.gun), {tarih:k.gun, sayi:inc(1)}, {merge:true});
    await b.commit();
  },
  guncelle: (id, a) => B(id).update(a),
  async sil(id, gun) {
    const b = db.batch();
    b.delete(B(id));
    b.set(db.collection("gunler").doc(gun), {tarih:gun, sayi:inc(-1)}, {merge:true});
    await b.commit();
  },
  async siraYaz(degisenler) {
    for (let i = 0; i < degisenler.length; i += 400) {
      const b = db.batch();
      degisenler.slice(i, i+400).forEach(([id, sira]) => b.update(B(id), {sira}));
      await b.commit();
    }
  },
  gunuDinle(gun, cb) {
    return db.collection("biletler").where("gun","==",gun).onSnapshot(
      s => { durum(true); cb(s.docs.map(d => ({id:d.id, ...d.data()}))); },
      e => { durum(false); console.error(e); }
    );
  },
  gunleriDinle(cb) {
    return db.collection("gunler").orderBy("tarih","desc").limit(365).onSnapshot(
      s => cb(s.docs.map(d => d.data()).filter(g => (g.sayi||0) > 0)), e => console.error(e));
  }
};
function durum(bagli) {
  $("durum").className = "durum" + (bagli ? "" : " yok");
  $("durum").lastElementChild.textContent = bagli ? "Canlı" : "Bağlantı yok";
}

/* ---------- Durum ---------- */
let rol = null;
try { const r = localStorage.getItem("rol"); if (r === "admin" || r === "pist") rol = r; } catch {}
let bugun = gunAnahtari();
let bugunListe = [], gunDetayListe = [];
let oncekiIdler = new Set(), ilkYukleme = true;
let seciliGun = null, gunAbonelik = null, detayAbonelik = null, gunlerAbonelik = null;
let aktifSayfa = "bugun";
let surukleniyor = false, cizimBekliyor = false;

/* ---------- Bilet görünümü ---------- */
// mod: "izle" | "pist" | "admin" | "gecmis"
function biletHTML(b, mod, yeni) {
  const aktif = aktifMi(b);
  const yonetim = mod === "pist" || mod === "admin";
  let butonlar = "";
  if (yonetim) {
    if (aktif && !b.baslama) butonlar += `<button class="kucuk baslat" data-is="baslat" data-id="${esc(b.id)}">▶ Başlat</button>`;
    butonlar += aktif
      ? `<button class="kucuk pasifle" data-is="durum" data-id="${esc(b.id)}">Pasif yap</button>`
      : `<button class="kucuk aktifle" data-is="durum" data-id="${esc(b.id)}">Aktif yap</button>`;
  }
  if (mod === "admin" || mod === "gecmis") {
    butonlar += `<button class="kucuk" data-is="duzenle" data-id="${esc(b.id)}">Düzenle</button>
                 <button class="kucuk sil" data-is="sil" data-id="${esc(b.id)}">Sil</button>`;
  }
  return `<div class="bilet${yeni ? " yeni" : ""}" data-id="${esc(b.id)}" data-aktif="${aktif ? 1 : 0}"
      data-baslama="${b.baslama || ""}" data-durma="${b.durma || ""}" data-sure="${parseInt(b.sure) || 0}">
    <div class="koc"><span class="saat num">${esc(b.saat)}</span><span class="saat-et">satış</span></div>
    <div class="govde">
      <div class="ust">
        <div class="no num"><small>No</small>${esc(b.bilet)}</div>
        <span class="cip"></span>
        ${yonetim ? `<button class="tutamac" aria-label="Sürükleyerek sırayı değiştir">⠿</button>` : ""}
      </div>
      <div class="detay"><b>${esc(b.kisi)}</b> kişi, <b>${esc(b.sure)}</b> dakika</div>
      ${b.baslama ? `<div class="zaman"><span class="krono num"></span><span class="bitis">Bitiş ${saatYazi(new Date(b.baslama + (parseInt(b.sure)||0)*60000))}</span></div>` : ""}
      ${butonlar ? `<div class="islemler">${butonlar}</div>` : ""}
    </div>
  </div>`;
}

// Kartın rengini, etiketini ve kronometresini günceller (her saniye çağrılır)
function kartGuncelle(k, simdi = Date.now()) {
  const aktif = k.dataset.aktif === "1", bas = +k.dataset.baslama || 0, dur = +k.dataset.durma || 0, sure = +k.dataset.sure * 60000;
  let sinif, etiket;
  const gecen = bas ? ((!aktif && dur) ? dur : simdi) - bas : 0;
  if (!aktif) { sinif = "pasif"; etiket = "PASİF"; }
  else if (!bas) { sinif = "aktif"; etiket = "BEKLİYOR"; }
  else if (gecen > sure) { sinif = "doldu"; etiket = "SÜRE DOLDU"; }
  else { sinif = "aktif"; etiket = "PİSTTE"; }
  k.classList.toggle("aktif", sinif === "aktif");
  k.classList.toggle("doldu", sinif === "doldu");
  k.classList.toggle("pasif", sinif === "pasif");
  const c = k.querySelector(".cip"); if (c.textContent !== etiket) c.textContent = etiket;
  const kr = k.querySelector(".krono"); if (kr) kr.textContent = sureYazi(gecen);
}
setInterval(() => { const s = Date.now(); document.querySelectorAll(".bilet[data-baslama]:not([data-baslama=''])").forEach(k => kartGuncelle(k, s)); }, 1000);

function sayacHTML(l) {
  const say = f => { const x = l.filter(f); return [x.length, x.reduce((t,b) => t + (parseInt(b.kisi)||0), 0)]; };
  const [tb, tk] = say(() => true);
  const [bb, bk] = say(b => aktifMi(b) && !b.baslama);
  const [pb, pk] = say(b => aktifMi(b) && b.baslama);
  const kutu = (et, sinif, bil, kis) => `<div class="sayac ${sinif}"><div class="et">${et}</div><div class="deger num">${bil}</div><div class="kisi"><b>${kis}</b> kişi</div></div>`;
  return kutu("Bugün toplam", "", tb, tk) + kutu("Bekleyen", "yesil", bb, bk) + kutu("Pistte", "sari", pb, pk);
}

function listeCiz(el, l, mod, yeniler) {
  el.innerHTML = l.map(b => biletHTML(b, mod, yeniler && yeniler.has(b.id))).join("")
    || `<div class="bos">Bugün henüz bilet yok.<br>Yeni biletler burada anında görünecek.</div>`;
  el.querySelectorAll(".bilet").forEach(k => kartGuncelle(k));
}

function bugunuCiz() {
  if (surukleniyor) { cizimBekliyor = true; return; }
  const l = sirala(bugunListe);
  const yeniler = new Set(ilkYukleme ? [] : l.filter(b => !oncekiIdler.has(b.id)).map(b => b.id));
  listeCiz($("listeBugun"), l, "izle", yeniler);
  listeCiz($("listePist"), l, "pist", yeniler);
  listeCiz($("listeAdmin"), l, "admin", null);
  document.querySelectorAll("[data-sayac]").forEach(e => e.innerHTML = sayacHTML(l));
  oncekiIdler = new Set(l.map(b => b.id)); ilkYukleme = false;
}
function gunDetayCiz() {
  const l = sirala(gunDetayListe);
  listeCiz($("listeGun"), l, "gecmis", null);
  $("sayacGun").innerHTML = sayacHTML(l).replace("Bugün toplam", "Gün toplamı");
}

/* ---------- Abonelikler ---------- */
function bugunuDinle() {
  if (gunAbonelik) gunAbonelik();
  ilkYukleme = true; oncekiIdler = new Set();
  $("bugunYazi").textContent = gunYazi(bugun);
  gunAbonelik = Veri.gunuDinle(bugun, l => { bugunListe = l; bugunuCiz(); });
}
function gunleriDinle() {
  if (gunlerAbonelik) return;
  gunlerAbonelik = Veri.gunleriDinle(gunler => {
    $("gunListesi").innerHTML = gunler.map(g =>
      `<button class="gun" data-gun="${esc(g.tarih)}"><b>${esc(gunYazi(g.tarih))}</b><span>${g.sayi} bilet ›</span></button>`
    ).join("") || `<div class="bos">Henüz kayıtlı gün yok.</div>`;
  });
}
setInterval(() => { const g = gunAnahtari(); if (rol && g !== bugun) { bugun = g; bugunuDinle(); } }, 30000);

/* ---------- Giriş ve yetki ---------- */
let girisRol = "pist", girisHedef = null;
function girisAc(onRol, hedef, aciklama) {
  girisRol = onRol; girisHedef = hedef;
  document.querySelectorAll(".secim button").forEach(b => b.setAttribute("aria-pressed", b.dataset.rol === onRol));
  $("girisAciklama").textContent = aciklama || "Giriş türünü seçip şifrenizi girin.";
  $("girisIptal").classList.toggle("gizli", !rol);
  $("sifre").value = ""; $("sifreHata").textContent = "";
  $("giris").classList.remove("gizli");
  setTimeout(() => $("sifre").focus(), 50);
}
document.querySelectorAll(".secim button").forEach(b => b.onclick = () => {
  girisRol = b.dataset.rol;
  document.querySelectorAll(".secim button").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("sifre").focus();
});
function girisYap() {
  if (ozet("gokart:" + $("sifre").value) !== SIFRE_OZET[girisRol]) { $("sifreHata").textContent = "Şifre yanlış. Tekrar deneyin."; return; }
  rol = girisRol;
  try { localStorage.setItem("rol", rol); } catch {}
  $("giris").classList.add("gizli");
  uygulamayiBaslat(girisHedef || (rol === "admin" ? "admin" : "pist"));
}
$("girisBtn").onclick = girisYap;
$("sifre").onkeydown = e => { if (e.key === "Enter") girisYap(); };
$("girisIptal").onclick = () => $("giris").classList.add("gizli");
$("cikisBtn").onclick = () => {
  if (!confirm("Çıkış yapılsın mı?")) return;
  rol = null; try { localStorage.removeItem("rol"); } catch {}
  girisAc("pist");
};

const adminSayfasi = s => s === "gecmis" || s === "admin";
function menuGuncelle() {
  $("rolYazi").textContent = rol === "admin" ? "Admin" : "Pist";
  document.querySelectorAll("nav button").forEach(b => {
    const kilit = rol !== "admin" && adminSayfasi(b.dataset.sayfa);
    b.classList.toggle("kilitli", kilit);
    b.querySelector(".ik").textContent = kilit ? "🔒" : ({bugun:"🎟️",gecmis:"📅",pist:"🏁",admin:"🔑"})[b.dataset.sayfa];
  });
}
function sayfaAc(ad) {
  if (rol !== "admin" && adminSayfasi(ad)) { girisAc("admin", ad, "Bu bölüm için admin şifresi gerekiyor."); return; }
  aktifSayfa = ad;
  ["bugun","gecmis","pist","admin"].forEach(s => $("sayfa-"+s).classList.toggle("gizli", s !== ad));
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.sayfa === ad));
  if (ad === "gecmis") gunleriDinle();
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => sayfaAc(b.dataset.sayfa));

let basladi = false;
function uygulamayiBaslat(sayfa) {
  menuGuncelle();
  if (!basladi) { basladi = true; bugunuDinle(); } else bugunuCiz();
  if (seciliGun) gunDetayCiz();
  sayfaAc(sayfa);
}
if (rol) { $("giris").classList.add("gizli"); uygulamayiBaslat(rol === "admin" ? "admin" : "pist"); }
else girisAc("pist");

/* ---------- Geçmiş ---------- */
$("gunListesi").onclick = e => {
  const b = e.target.closest("[data-gun]"); if (!b) return;
  seciliGun = b.dataset.gun;
  $("gunBaslik").textContent = gunYazi(seciliGun);
  $("gunListesiKutu").classList.add("gizli"); $("gunDetayKutu").classList.remove("gizli");
  if (detayAbonelik) detayAbonelik();
  detayAbonelik = Veri.gunuDinle(seciliGun, l => { gunDetayListe = l; gunDetayCiz(); });
};
$("geriBtn").onclick = () => {
  if (detayAbonelik) { detayAbonelik(); detayAbonelik = null; }
  seciliGun = null;
  $("gunDetayKutu").classList.add("gizli"); $("gunListesiKutu").classList.remove("gizli");
};

/* ---------- Yeni bilet ---------- */
function kontrol(bilet, kisi, sure) {
  if (!bilet) return "Bilet numarasını girin.";
  if (!/^\d+$/.test(kisi) || +kisi < 1) return "Kişi sayısını rakamla girin.";
  if (!/^\d+$/.test(sure) || +sure < 1) return "Süreyi dakika olarak rakamla girin.";
  return "";
}
let kaydediliyor = false;
async function kaydet() {
  if (kaydediliyor || rol !== "admin") return;
  const bilet = $("fBilet").value.trim(), kisi = $("fKisi").value.trim(), sure = $("fSure").value.trim();
  const h = kontrol(bilet, kisi, sure); $("formHata").textContent = h; if (h) return;
  if (bugunListe.some(b => b.bilet === bilet) && !confirm(`${bilet} numaralı bilet bugün zaten girilmiş. Yine de kaydedilsin mi?`)) return;
  const simdi = new Date();
  const enUst = bugunListe.length ? Math.min(...bugunListe.map(siraDegeri)) : 0;
  kaydediliyor = true; $("kaydetBtn").textContent = "Kaydediliyor...";
  try {
    await Veri.ekle({ bilet, kisi, sure, gun:gunAnahtari(simdi), saat:saatYazi(simdi), zaman:simdi.getTime(),
                      sira: enUst - 1024, aktif:true, baslama:null, durma:null });
    $("fBilet").value = sonrakiNumara(bilet);
    $("fKisi").value = ""; $("fSure").value = "";
    $("fKisi").focus();
  } catch (e) { $("formHata").textContent = "Kayıt yapılamadı. İnternet bağlantısını kontrol edin."; console.error(e); }
  kaydediliyor = false; $("kaydetBtn").textContent = "Bileti kaydet";
}
$("kaydetBtn").onclick = kaydet;
["fBilet","fKisi","fSure"].forEach((id, i, a) => $(id).onkeydown = e => {
  if (e.key === "Enter") { e.preventDefault(); i < a.length - 1 ? $(a[i+1]).focus() : kaydet(); }
});

/* ---------- Bilet işlemleri ---------- */
const bul = id => bugunListe.find(b => b.id === id) || gunDetayListe.find(b => b.id === id);
const hataGoster = () => alert("İşlem yapılamadı. İnternet bağlantısını kontrol edin.");
let duzenlenen = null;

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-is]"); if (!t || !rol) return;
  const b = bul(t.dataset.id); if (!b) return;
  const is = t.dataset.is;
  if ((is === "duzenle" || is === "sil") && rol !== "admin") return;
  try {
    if (is === "baslat") {
      if (!confirm(`${b.bilet} numaralı biletin süresi başlatılsın mı?`)) return;
      await Veri.guncelle(b.id, {baslama: Date.now(), durma: null});
    }
    if (is === "durum") {
      if (aktifMi(b)) {
        if (!confirm(`${b.bilet} numaralı bilet PASİF (kullanıldı) yapılsın mı?`)) return;
        await Veri.guncelle(b.id, {aktif:false, durma: b.baslama ? Date.now() : null});
      } else {
        if (!confirm(`${b.bilet} numaralı bilet tekrar AKTİF yapılsın mı?`)) return;
        await Veri.guncelle(b.id, {aktif:true, durma:null});
      }
    }
    if (is === "sil") {
      if (!confirm(`${b.bilet} numaralı bilet (${b.saat}) silinsin mi?`)) return;
      await Veri.sil(b.id, b.gun);
    }
  } catch (err) { console.error(err); hataGoster(); }
  if (is === "duzenle") {
    duzenlenen = b;
    $("dBilet").value = b.bilet; $("dKisi").value = b.kisi; $("dSure").value = b.sure; $("dSaat").value = b.saat;
    $("dSifirla").classList.toggle("gizli", !b.baslama);
    $("dHata").textContent = "";
    $("duzenle").showModal();
  }
});
$("dIptal").onclick = () => $("duzenle").close();
$("dKaydet").onclick = async () => {
  const bilet = $("dBilet").value.trim(), kisi = $("dKisi").value.trim(), sure = $("dSure").value.trim(), saat = $("dSaat").value;
  const h = kontrol(bilet, kisi, sure) || (!saat ? "Saati girin." : ""); $("dHata").textContent = h; if (h) return;
  try { await Veri.guncelle(duzenlenen.id, {bilet, kisi, sure, saat, zaman:zamanHesapla(duzenlenen.gun, saat)}); $("duzenle").close(); }
  catch (e) { $("dHata").textContent = "Kaydedilemedi. İnternet bağlantısını kontrol edin."; }
};
$("dSifirla").onclick = async () => {
  if (!confirm("Bu biletin süre başlangıcı silinsin mi? Bilet tekrar 'Bekliyor' durumuna döner.")) return;
  try { await Veri.guncelle(duzenlenen.id, {baslama:null, durma:null}); $("duzenle").close(); }
  catch (e) { $("dHata").textContent = "Kaydedilemedi. İnternet bağlantısını kontrol edin."; }
};

/* ---------- Sürükleyerek sıralama ---------- */
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".tutamac"); if (!h || surukleniyor) return;
  e.preventDefault();
  const kart = h.closest(".bilet"), liste = kart.parentElement;
  try { h.setPointerCapture(e.pointerId); } catch {}
  const st = { h, kart, liste, pid:e.pointerId, y0:e.clientY, y:e.clientY, acik:false };
  st.timer = setTimeout(() => kaldir(st), 160);
  const hareket = ev => { if (ev.pointerId !== st.pid) return; st.y = ev.clientY; if (st.acik) ilerle(st); };
  const birakEv = ev => {
    if (ev.pointerId !== st.pid) return;
    clearTimeout(st.timer);
    h.removeEventListener("pointermove", hareket); h.removeEventListener("pointerup", birakEv); h.removeEventListener("pointercancel", birakEv);
    if (st.acik) birak(st);
  };
  h.addEventListener("pointermove", hareket); h.addEventListener("pointerup", birakEv); h.addEventListener("pointercancel", birakEv);
});

function kaldir(st) {
  st.acik = true; surukleniyor = true;
  st.kartlar = [...st.liste.querySelectorAll(".bilet")];
  st.idx = st.kartlar.indexOf(st.kart); st.hedef = st.idx;
  st.sc0 = window.scrollY;
  st.merkez = st.kartlar.map(k => { const r = k.getBoundingClientRect(); return r.top + window.scrollY + r.height/2; });
  const r = st.kart.getBoundingClientRect();
  st.adim = r.height + 10;
  document.body.classList.add("surukleme-acik");
  st.kart.classList.add("kalkik");
  st.kart.style.transform = "translateY(-4px) scale(1.02)";
  const dongu = () => {
    if (!st.acik) return;
    const kenar = 90;
    if (st.y < kenar + 60) window.scrollBy(0, -10);
    else if (st.y > window.innerHeight - kenar - 40) window.scrollBy(0, 10);
    ilerle(st);
    st.raf = requestAnimationFrame(dongu);
  };
  st.raf = requestAnimationFrame(dongu);
}

function ilerle(st) {
  const dy = st.y - st.y0 + (window.scrollY - st.sc0);
  st.kart.style.transform = `translateY(${dy - 4}px) scale(1.02)`;
  const c = st.merkez[st.idx] + dy;
  let h = st.idx;
  for (let i = 0; i < st.idx; i++) if (c < st.merkez[i]) { h = i; break; }
  if (h === st.idx) for (let i = st.kartlar.length - 1; i > st.idx; i--) if (c > st.merkez[i]) { h = i; break; }
  st.hedef = h;
  st.kartlar.forEach((k, i) => {
    if (i === st.idx) return;
    let kay = 0;
    if (st.idx < h && i > st.idx && i <= h) kay = -st.adim;
    if (h < st.idx && i >= h && i < st.idx) kay = st.adim;
    k.style.transform = kay ? `translateY(${kay}px)` : "";
  });
}

function birak(st) {
  st.acik = false; cancelAnimationFrame(st.raf);
  const ids = st.kartlar.map(k => k.dataset.id);
  const [tasinan] = ids.splice(st.idx, 1); ids.splice(st.hedef, 0, tasinan);
  st.kartlar.forEach(k => k.style.transform = "");
  st.kart.classList.remove("kalkik");
  document.body.classList.remove("surukleme-acik");
  surukleniyor = false;
  if (st.hedef === st.idx) { if (cizimBekliyor) { cizimBekliyor = false; bugunuCiz(); } return; }
  const degisenler = [];
  ids.forEach((id, i) => {
    const b = bugunListe.find(x => x.id === id); const yeni = i * 1024;
    if (b && b.sira !== yeni) { b.sira = yeni; degisenler.push([id, yeni]); }
  });
  cizimBekliyor = false; bugunuCiz();
  Veri.siraYaz(degisenler).catch(err => { console.error(err); hataGoster(); });
}
</script>
